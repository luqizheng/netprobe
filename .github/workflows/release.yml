name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc

jobs:
  build:
    name: Build ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            arch: amd64
            target: x86_64-unknown-linux-musl
            packages: musl-tools
          - os: ubuntu-latest
            os_name: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
            packages: musl-tools gcc-aarch64-linux-gnu
          - os: macos-latest
            os_name: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            os_name: macos
            arch: amd64
            target: x86_64-apple-darwin
          - os: windows-latest
            os_name: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross linkers
        if: matrix.os_name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package (linux / macos)
        if: matrix.os_name != 'windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/netprobe-server dist/
          cp target/${{ matrix.target }}/release/netprobe-client dist/
          tar -czf netprobe-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz -C dist netprobe-server netprobe-client

      - name: Package (windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/netprobe-server.exe dist/
          Copy-Item target/${{ matrix.target }}/release/netprobe-client.exe dist/
          Compress-Archive -Path dist/netprobe-server.exe, dist/netprobe-client.exe -DestinationPath netprobe-windows-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netprobe-${{ matrix.os_name }}-${{ matrix.arch }}
          path: netprobe-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILES=$(ls dist/netprobe-*.tar.gz dist/netprobe-*.zip dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "netprobe $TAG" --generate-notes
          fi