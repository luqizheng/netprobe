name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc

jobs:
  build:
    name: Build linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            packages: musl-tools
          - target: aarch64-unknown-linux-musl
            arch: arm64
            packages: musl-tools gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross linkers
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/netprobe-server dist/
          cp target/${{ matrix.target }}/release/netprobe-client dist/
          tar -czf netprobe-linux-${{ matrix.arch }}.tar.gz -C dist netprobe-server netprobe-client
          sha256sum netprobe-linux-${{ matrix.arch }}.tar.gz > netprobe-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netprobe-linux-${{ matrix.arch }}
          path: |
            netprobe-linux-${{ matrix.arch }}.tar.gz
            netprobe-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILES=$(ls dist/netprobe-linux-*.tar.gz dist/netprobe-linux-*.tar.gz.sha256 dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "netprobe $TAG" --generate-notes
          fi